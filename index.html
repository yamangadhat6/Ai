<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الذكاء الاصطناعي المحلي</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div>
                <h2>مساعد الذكاء الاصطناعي</h2>
            </div>
            <span class="badge" id="status-badge">جاري التهيئة...</span>
        </header>

        <!-- Progress Banner -->
        <div id="download-banner">
            <span id="progress-text">جاري بدء التحميل...</span>
            <div class="progress-bar-bg">
                <div id="progress-bar"></div>
            </div>
        </div>

        <!-- Chat messages -->
        <div id="chat-history">
            <div class="msg ai">
                أهلاً بك! هذا التطبيق يقوم بتشغيل شبكة عصبية اصطناعية داخل متصفحك مباشرة بدون إرسال بياناتك لأي خادم.
            </div>
        </div>

        <!-- Input Area -->
        <footer>
            <textarea id="user-input" placeholder="اكتب سؤالك هنا..." disabled></textarea>
            <button id="send-btn" disabled>إرسال</button>
        </footer>
    </div>

    <!-- استدعاء ملف الجافاسكريبت كـ Module -->
    <script type="module" src="app.js"></script>
</body>
</html>
