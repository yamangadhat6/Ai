<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background-color: #1e293b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            padding: 15px 20px;
            background-color: #334155;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 1px solid #475569;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #2563eb;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: #334155;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            🤖 رفيق الذكاء الاصطناعي
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">
                مرحباً بك! أنا ذكاء اصطناعي مجاني، كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." />
            <button id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            // 1. إضافة رسالة المستخدم إلى الواجهة
            appendMessage(prompt, 'user-message');
            userInput.value = '';
            
            // تعطيل الزر أثناء التفكير
            sendBtn.disabled = true;
            
            // إضافة عنصر انتظار
            const loadingId = appendMessage('جاري التفكير...', 'ai-message');

            try {
                // 2. إرسال الطلب لمحرك الذكاء الاصطناعي المجاني بدون API Key
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const data = await response.text();

                // 3. تحديث رسالة الذكاء الاصطناعي بالرد النهائي
                document.getElementById(loadingId).innerText = data;
            } catch (error) {
                document.getElementById(loadingId).innerText = 'عذراً، حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.';
            } finally {
                sendBtn.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
