<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="manifest.json">
  <title>Yaman AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">Y</div><div><b>Yaman AI</b><small>ذكاء اصطناعي محلي</small></div></div>
    <button id="newChat" class="new">＋ محادثة جديدة</button>
    <div id="history" class="history"></div>
    <div class="side-note">🔒 وضع محلي<br><span>المحادثات تُحفظ على جهازك.</span></div>
  </aside>

  <main class="main">
    <header>
      <button id="menu" class="icon">☰</button>
      <div><b>Yaman AI</b><span id="status">جاهز</span></div>
      <button id="clear" class="icon" title="مسح المحادثة">⌫</button>
    </header>

    <section id="chat" class="chat">
      <div class="welcome">
        <div class="hero-logo">Y</div>
        <h1>أهلاً بك في Yaman AI</h1>
        <p>مساعد ذكاء اصطناعي يعمل محليًا في المتصفح عند توفر WebGPU.</p>
        <div class="cards">
          <button data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة">اشرح لي الذكاء الاصطناعي</button>
          <button data-prompt="ساعدني في كتابة فكرة مشروع">فكرة مشروع</button>
          <button data-prompt="علمني Python من الصفر">تعلم Python</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div id="modelBox" class="modelbox">
        <span>النموذج:</span>
        <select id="model">
          <option value="Qwen/Qwen2.5-0.5B-Instruct">Qwen 2.5 0.5B (خفيف)</option>
        </select>
        <span id="downloadState">لم يتم تحميل النموذج</span>
      </div>
      <form id="form" class="composer">
        <textarea id="input" rows="1" placeholder="اكتب رسالتك..." autocomplete="off"></textarea>
        <button id="send" type="submit">➤</button>
      </form>
      <div class="hint">Enter للإرسال • Shift+Enter لسطر جديد</div>
    </div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
